name: termai
description: "TERMAI — терминальный тренажёр с ИИ-наставником (Docker/Linux/Git)"
publish_to: "none"
version: 1.12.5+24

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  crypto: ^3.0.5
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  sensors_plus: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/courses.json
    - assets/noise.png
    - assets/icon/termai.png
    - assets/icon/clawd.png

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/termai.png"
  adaptive_icon_background: "#16181C"
  adaptive_icon_foreground: "assets/icon/termai.png"
