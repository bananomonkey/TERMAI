name: termai
description: "TERMAI — тренажёр навыков с ИИ-наставником (языки, Linux, Docker, Git и другие курсы)"
publish_to: "none"
version: 1.22.0+48

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_markdown: ^0.7.4
  path_provider: ^2.1.4
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.0.0
  image_picker: ^1.1.2
  flutter_timezone: ^5.1.1
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  file_picker: ^13.3.0
  graphview: ^1.5.1
  llamadart: ^0.17.0
  flutter_secure_storage: ^11.2.0
  open_filex: ^5.0.0
  yaml: ^3.1.4
  flutter_tts: ^4.2.5
  workmanager: ^0.10.10
  device_info_plus: ^13.3.0
  sherpa_onnx: ^2.0.1
  piper_phonemize: ^1.5.9
  audioplayers: ^6.8.1
  archive: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/courses.json
    - assets/icon/termai.png
    - assets/icon/termai_closed.png
    - assets/icon/termai_open.png
    - assets/
    - assets/fonts/
    - assets/icon/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Локальный ИИ: только llama.cpp (GGUF), без LiteRT-LM и Vulkan.
# Это заметно уменьшает APK и оставляет CPU-инференс на arm64.
    - family: Itim
      fonts:
        - asset: assets/fonts/Itim.ttf
    - family: ADLaM Display
      fonts:
        - asset: assets/fonts/ADLaM Display.ttf
    - family: Aclonica
      fonts:
        - asset: assets/fonts/Aclonica.ttf
    - family: Abril Fatface
      fonts:
        - asset: assets/fonts/Abril Fatface.ttf
    - family: Acme
      fonts:
        - asset: assets/fonts/Acme.ttf
    - family: Alata
      fonts:
        - asset: assets/fonts/Alata.ttf
    - family: Alfa Slab One
      fonts:
        - asset: assets/fonts/Alfa Slab One.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/Inter Tight.ttf
    - family: Quintessential
      fonts:
        - asset: assets/fonts/Quintessential.ttf
    - family: Intel One Mono
      fonts:
        - asset: assets/fonts/Intel One Mono.ttf
hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [cpu]
            cpu_profile: compact
          android-x64:
            backends: [cpu]

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/termai.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/termai_fg.png"
