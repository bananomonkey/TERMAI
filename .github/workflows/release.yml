name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
        working-directory: mobile
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
        working-directory: mobile
      - name: Tests
        run: flutter test
        working-directory: mobile

  android:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore release signing key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > mobile/android/app/termai-release.jks
          cat > mobile/android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=termai-release.jks
          EOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/emulator /opt/ghc
          df -h /
      - name: Pub get
        run: flutter pub get
        working-directory: mobile
      - name: Build split APKs
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi \
            --dart-define=TERMAI_AI_PROXY_URL=${{ vars.TERMAI_AI_PROXY_URL }} 2>&1 | tee build.log
        working-directory: mobile
      - name: Build failure details
        if: failure()
        shell: bash
        working-directory: mobile
        run: |
          echo "::error title=Disk space::$(df -h / | tail -n 1 | tr -s ' ')"
          if [ -f build.log ]; then
            if grep -q "FAILURE: Build failed" build.log; then
              sed -n '/FAILURE: Build failed/,/BUILD FAILED/p' build.log \
                | head -n 14 | while IFS= read -r line; do
                  echo "::error title=Gradle::$line"
                done
            else
              tail -n 40 build.log | while IFS= read -r line; do
                echo "::error title=Android build::$line"
              done
            fi
          fi
      - name: Collect APKs
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk TERMAI-arm64-v8a.apk
          cp mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk TERMAI-armeabi-v7a.apk
          cp mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk TERMAI-x86_64.apk
          # совместимый псевдоним для старых ссылок: большинство телефонов — arm64
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk TERMAI.apk
      - name: APK sizes
        run: |
          ls -lh mobile/build/app/outputs/flutter-apk/*.apk
      - name: Build AAB for Google Play
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --dart-define=TERMAI_AI_PROXY_URL=${{ vars.TERMAI_AI_PROXY_URL }} 2>&1 | tee aab.log
        working-directory: mobile
      - name: AAB failure details
        if: failure()
        shell: bash
        working-directory: mobile
        run: |
          if [ -f aab.log ]; then
            tail -n 120 aab.log | while IFS= read -r line; do
              echo "::error title=AAB::$line"
            done
          fi
      - name: Upload AAB build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aab-build-log
          path: mobile/aab.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Rename AAB
        run: cp mobile/build/app/outputs/bundle/release/app-release.aab TERMAI.aab
      - uses: actions/upload-artifact@v4
        with:
          name: termai-android-artifacts
          path: |
            TERMAI.apk
            TERMAI-arm64-v8a.apk
            TERMAI-armeabi-v7a.apk
            TERMAI-x86_64.apk
            TERMAI.aab

  release:
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
