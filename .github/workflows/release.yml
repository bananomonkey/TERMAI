name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
        working-directory: mobile
      - name: Build APK
        run: flutter build apk --release
        working-directory: mobile
      - name: Rename APK
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk TERMAI.apk
      - uses: actions/upload-artifact@v4
        with:
          name: termai-android.apk
          path: TERMAI.apk

  release:
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TERMAI.apk
          generate_release_notes: true
